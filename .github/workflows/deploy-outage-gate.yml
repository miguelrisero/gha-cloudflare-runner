# The outage gate is a separate Worker with its own secrets.
# CLOUDFLARE_DEPLOY_API_TOKEN must be deploy-scoped.
# Do not reuse CLOUDFLARE_API_TOKEN because the orphan audit token is read-only.
name: Deploy outage gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the outage gate Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-outage-gate
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy the outage gate Worker
        run: npx wrangler deploy --config outage-gate/wrangler.jsonc

      - name: Report the required secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Set these three secrets once from an operator machine:' \
            'npx wrangler secret put OUTAGE_GATE_PRIVATE_KEY --config outage-gate/wrangler.jsonc' \
            'npx wrangler secret put OUTAGE_GATE_TOKEN --config outage-gate/wrangler.jsonc' \
            'npx wrangler secret put OUTAGE_GATE_ADMIN_TOKEN --config outage-gate/wrangler.jsonc' \
            'The gate stays closed until an operator opens it.' >&2
