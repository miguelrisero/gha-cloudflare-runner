name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-worker:
    name: ESLint (worker + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint

  unit-tests:
    name: Node unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  wrangler-config:
    name: Wrangler dry run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate the Wrangler configurations
        run: |
          npm run check
          npm run check:outage-gate

  shell:
    name: ShellCheck (container + scripts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install ShellCheck 0.11.0
        shell: bash
        env:
          SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors \
            --output "$archive" "$SHELLCHECK_URL"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Verify ShellCheck version
        shell: bash
        run: |
          set -euo pipefail
          version="$(shellcheck --version | sed -n 's/^version: //p')"
          if [[ "$version" != "0.11.0" ]]; then
            printf 'Expected ShellCheck 0.11.0, got %s\n' "$version" >&2
            exit 1
          fi
      - name: Check shell scripts
        run: shellcheck -S style container/*.sh scripts/*.sh

  workflows:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install ShellCheck 0.11.0
        shell: bash
        env:
          SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors \
            --output "$archive" "$SHELLCHECK_URL"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Verify ShellCheck version
        shell: bash
        run: |
          set -euo pipefail
          version="$(shellcheck --version | sed -n 's/^version: //p')"
          if [[ "$version" != "0.11.0" ]]; then
            printf 'Expected ShellCheck 0.11.0, got %s\n' "$version" >&2
            exit 1
          fi
      - name: Install actionlint 1.7.12
        shell: bash
        env:
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors \
            --output "$archive" "$ACTIONLINT_URL"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" \
            | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check workflows
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(
            .github/workflows/*.yml
            .github/workflows/*.yaml
          )
          if (( ${#workflow_files[@]} == 0 )); then
            printf 'No workflow files found\n' >&2
            exit 1
          fi
          actionlint -config-file .github/actionlint.yaml "${workflow_files[@]}"

  python:
    name: Python syntax (timing collector)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile the Python script
        run: python -m py_compile scripts/collect-timings.py

  container-build:
    name: Container image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build the runner container image
        run: docker build --file container/Dockerfile --tag gha-cloudflare-runner:ci container

  ci-ok:
    name: CI
    if: always()
    needs:
      - lint-worker
      - unit-tests
      - wrangler-config
      - shell
      - workflows
      - python
      - container-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Require all CI jobs to succeed
        shell: bash
        run: |
          set -euo pipefail
          results=(
            "${{ needs.lint-worker.result }}"
            "${{ needs.unit-tests.result }}"
            "${{ needs.wrangler-config.result }}"
            "${{ needs.shell.result }}"
            "${{ needs.workflows.result }}"
            "${{ needs.python.result }}"
            "${{ needs.container-build.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              printf 'Required CI job did not succeed: %s\n' "$result" >&2
              exit 1
            fi
          done
